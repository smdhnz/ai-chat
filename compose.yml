services:
  chat:
    build: .
    image: ai-chat:latest
    container_name: ai-chat
    restart: unless-stopped
    env_file: .env
    environment:
      PI_AUTH_PATH: /app/data/auth.json
    volumes:
      - ./data:/app/data

  tunnel:
    image: alpine:latest
    container_name: ai-chat-tunnel
    restart: unless-stopped
    depends_on:
      - chat
    volumes:
      - ~/.ssh:/root/.ssh:ro
    command: >
      sh -c "apk add --no-cache openssh-client &&
      exec ssh -N
      -o StrictHostKeyChecking=yes
      -o ExitOnForwardFailure=yes
      -o ServerAliveInterval=30
      -o ServerAliveCountMax=3
      -i /root/.ssh/id_ed25519
      -p 2222
      -R chat:80:chat:3000
      gateway.fumiya.dev"
